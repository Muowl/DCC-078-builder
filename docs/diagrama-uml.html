<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama UML - Builder</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #ffffff; }
        svg { display: block; width: 1180px; max-width: 100%; height: auto; }
        .nome { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; fill: #2d3142; }
        .membro { font-family: Consolas, monospace; font-size: 12px; fill: #2d3142; }
        .tag { font-family: Consolas, monospace; font-size: 11px; text-anchor: middle; fill: #4f5d75; }
    </style>
</head>
<body>
<svg viewBox="0 0 1180 710" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagrama-uml-title diagrama-uml-desc">
    <title id="diagrama-uml-title">Diagrama de classes do padrão Builder</title>
    <desc id="diagrama-uml-desc">DiretorRequisicao usa RequisicaoBuilder, que cria a Requisicao imutável no método construir.</desc>
    <defs>
        <marker id="heranca" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,16 6,0 12" fill="#ffffff" stroke="#2d3142"/></marker>
        <marker id="associacao" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#4f5d75"/></marker>
        <marker id="agregacao" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 5,9 0,18 5,9 10" fill="#ffffff" stroke="#2d3142"/></marker>
        <marker id="composicao" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 5,9 0,18 5,9 10" fill="#2d3142" stroke="#2d3142"/></marker>
    </defs>
    <rect width="1180" height="710" fill="#ffffff"/>

    <line x1="420" y1="100" x2="560" y2="100" stroke="#4f5d75" marker-end="url(#associacao)"/>
    <rect x="426" y="78" width="16" height="16" fill="#ffffff"/><text x="428" y="90" class="membro">1</text>
    <rect x="536" y="78" width="16" height="16" fill="#ffffff"/><text x="538" y="90" class="membro">1</text>
    <path d="M840 320 V410" fill="none" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#associacao)"/>
    <rect x="856" y="357" width="80" height="17" fill="#ffffff"/><text x="896" y="370" class="tag">«create»</text>

    <g id="diretor-requisicao">
        <rect x="40" y="40" width="380" height="88" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M46 40 H414 Q420 40 420 46 V76 H40 V46 Q40 40 46 40" fill="#f1f3f5"/>
        <text x="230" y="63" class="nome">DiretorRequisicao</text>
        <line x1="40" y1="76" x2="420" y2="76" stroke="#bfc0c0"/>
        <text x="54" y="96" class="membro">+ consultaJson(String): Requisicao</text>
        <text x="54" y="116" class="membro">+ envioJson(String, String): Requisicao</text>
    </g>
    <g id="requisicao-builder">
        <rect x="560" y="40" width="560" height="280" rx="6" fill="#ffffff" stroke="#eb6c36"/>
        <rect x="560" y="40" width="560" height="280" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <path d="M566 40 H1114 Q1120 40 1120 46 V76 H560 V46 Q560 40 566 40" fill="#fff1eb"/>
        <text x="840" y="63" class="nome">RequisicaoBuilder</text>
        <line x1="560" y1="76" x2="1120" y2="76" stroke="#bfc0c0"/>
        <text x="574" y="96" class="membro">- url: String</text>
        <text x="574" y="116" class="membro">- metodo: String</text>
        <text x="574" y="136" class="membro">- cabecalhos: Map&lt;String, String&gt;</text>
        <text x="574" y="156" class="membro">- corpo: String</text>
        <text x="574" y="176" class="membro">- timeoutSegundos: int</text>
        <line x1="560" y1="188" x2="1120" y2="188" stroke="#bfc0c0"/>
        <text x="574" y="208" class="membro">+ url(String): RequisicaoBuilder</text>
        <text x="574" y="228" class="membro">+ metodo(String): RequisicaoBuilder</text>
        <text x="574" y="248" class="membro">+ cabecalho(String, String): RequisicaoBuilder</text>
        <text x="574" y="268" class="membro">+ corpo(String): RequisicaoBuilder</text>
        <text x="574" y="288" class="membro">+ timeoutSegundos(int): RequisicaoBuilder</text>
        <text x="574" y="308" class="membro">+ construir(): Requisicao</text>
    </g>
    <g id="requisicao">
        <rect x="560" y="410" width="560" height="260" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M566 410 H1114 Q1120 410 1120 416 V446 H560 V416 Q560 410 566 410" fill="#f1f3f5"/>
        <text x="840" y="433" class="nome">Requisicao</text>
        <line x1="560" y1="446" x2="1120" y2="446" stroke="#bfc0c0"/>
        <text x="574" y="466" class="membro">- url: String {readOnly}</text>
        <text x="574" y="486" class="membro">- metodo: String {readOnly}</text>
        <text x="574" y="506" class="membro">- cabecalhos: Map&lt;String, String&gt; {readOnly}</text>
        <text x="574" y="526" class="membro">- corpo: String {readOnly}</text>
        <text x="574" y="546" class="membro">- timeoutSegundos: int {readOnly}</text>
        <line x1="560" y1="558" x2="1120" y2="558" stroke="#bfc0c0"/>
        <text x="574" y="578" class="membro">+ getUrl(): String</text>
        <text x="574" y="598" class="membro">+ getMetodo(): String</text>
        <text x="574" y="618" class="membro">+ getCabecalhos(): Map&lt;String, String&gt;</text>
        <text x="574" y="638" class="membro">+ getCorpo(): String</text>
        <text x="574" y="658" class="membro">+ getTimeoutSegundos(): int</text>
    </g>
</svg>
</body>
</html>
